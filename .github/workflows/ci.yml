name: CI

on:
  push:
    branches: [master]
  pull_request:

# An explicit bash shell runs with `-eo pipefail`, so `command | tee log` fails when the command fails.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff
        run: |
          python -m pip install ruff==0.17.1
          ruff check .

  test:
    name: test (py${{ matrix.python-version }}, mujoco 4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (pinned core deps + package)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt -e ".[test]"
          python -c "import mujoco; print('MuJoCo', mujoco.__version__); assert mujoco.__version__.startswith('4.')"
      - name: Unit tests (headless)
        run: |
          mkdir -p build/ci
          python -m pytest tests -v 2>&1 | tee build/ci/pytest.log
      - name: Example smoke tests (headless)
        # pytest already runs examples 01, 04 (camera combos), 06, 07, 09, 11 and the 05/08/10 tasks;
        # this step covers example 03 and examples 02/04 across model families.
        run: |
          set -e
          exec > >(tee build/ci/examples.log) 2>&1
          python examples/simulation/03_cartesian_ik.py --headless
          for m in xarm5 xarm6 xarm7 uf850 lite6 xarm6_with_gripper xarm6_with_bio_gripper lite6_with_gripper \
                   uf850_with_gripper xarm5_with_vacuum_gripper xarm6_with_gripper_and_d405 \
                   xarm7_with_d435 uf850_with_gripper_and_d435 \
                   xarm6_with_ft_sensor_and_gripper xarm6_with_ft_sensor_and_vacuum_gripper xarm6_with_base_plate; do
            python examples/simulation/02_joint_control.py --headless --model $m
          done
          for m in xarm6_with_gripper xarm6_with_bio_gripper lite6_with_gripper gripper_g2 bio_gripper_g2 \
                   xarm7_with_bio_gripper xarm6_with_ft_sensor_and_gripper; do
            python examples/simulation/04_gripper_control.py --headless --model $m
          done
          # models without a jaw actuator must exit with code 2
          for m in lite6_vacuum_gripper vacuum_gripper xarm6_with_d435 ft_sensor xarm6_with_ft_sensor xarm_base_plate xarm6_with_base_plate; do
            rc=0; python examples/simulation/04_gripper_control.py --headless --model $m || rc=$?
            [ "$rc" -eq 2 ] || { echo "04_gripper_control --model $m: expected exit 2, got $rc"; exit 1; }
          done
      - name: Upload core logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-logs-${{ matrix.python-version }}-mujoco4
          path: build/ci/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools and editable core
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -r requirements-lock.txt -e .
      - name: Record source resource reference
        run: |
          mkdir -p build/ci
          python scripts/accept_installed.py --record-reference build/ci/reference.json 2>&1 | tee build/ci/reference.log
      - name: Build sdist, then wheel from sdist
        run: python -m build 2>&1 | tee build/ci/build.log
      - name: Validate release metadata and resources
        run: |
          python -m twine check dist/* 2>&1 | tee build/ci/twine.log
          python scripts/accept_installed.py --check-dist dist --reference build/ci/reference.json --report build/ci/distribution.json 2>&1 | tee build/ci/distribution.log
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          compression-level: 0
      - name: Upload standalone acceptance tools
        uses: actions/upload-artifact@v4
        with:
          name: installed-acceptance
          path: |
            scripts/accept_installed.py
            build/ci/reference.json
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/ci/

  installed:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    # Deliberately no checkout: only the wheel, reference and standalone script.
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: distributions
      - uses: actions/download-artifact@v4
        with:
          name: installed-acceptance
          path: acceptance
      - name: Install wheel and check dependency consistency
        run: |
          mkdir -p reports
          python -m pip install --upgrade pip
          pip install distributions/*.whl 2>&1 | tee reports/install.log
          # The wheel resolves MuJoCo from its declared range; record what a fresh install gets.
          python -c "import mujoco; v = tuple(int(x) for x in mujoco.__version__.split('.')[:2]); print('MuJoCo', mujoco.__version__); assert (4, 0) <= v < (5, 0), v" 2>&1 | tee reports/mujoco-version.log
          pip check 2>&1 | tee reports/pip-check.log
      - name: Validate installed resources and five-arm tasks
        run: |
          mkdir -p empty
          cd empty
          env -u PYTHONPATH python -I ../acceptance/scripts/accept_installed.py --reference ../acceptance/build/ci/reference.json --out-dir ../reports 2>&1 | tee ../reports/acceptance.log
      - name: Upload installed acceptance logs and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-logs-${{ matrix.python-version }}
          path: reports/
