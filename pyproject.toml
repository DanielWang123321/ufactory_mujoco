[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ufactory_mujoco"
version = "0.1.0.dev0"
description = "MuJoCo simulation and RL suite for UFACTORY robot arms (xArm 5/6/7, UF850, Lite 6) and grippers"
readme = "README.md"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
requires-python = ">=3.12"
# Core ranges verified in CI on Python 3.12 / 3.13 / 3.14.
dependencies = [
    "mujoco>=3.15,<4",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "pyyaml>=6.0,<7",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# Install CPU torch first to avoid the large CUDA wheel: see requirements-rl.txt
rl = ["gymnasium>=1.0,<2", "stable-baselines3>=2.4,<3"]
assets = ["trimesh>=4", "xacro"]

[project.scripts]
ufactory-mujoco = "ufactory_mujoco.cli:main"

[project.urls]
Homepage = "https://github.com/DanielWang123321/ufactory_mujoco"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["ufactory_mujoco*"]
namespaces = false

[tool.setuptools.package-data]
ufactory_mujoco = ["data/**/*"]
