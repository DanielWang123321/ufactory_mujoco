[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ufactory_mujoco"
version = "0.1.2"
description = "MuJoCo simulation and RL suite for UFACTORY robot arms (xArm 5/6/7, UF850, Lite 6), grippers, and depth cameras"
readme = "README.md"
license = "MIT AND BSD-3-Clause AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
requires-python = ">=3.12"
# Core ranges verified in CI on Python 3.12 / 3.13 / 3.14.
dependencies = [
    "mujoco>=3.15,<5",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "pyyaml>=6.0,<7",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# Install PyTorch first, otherwise pip pulls the large CUDA build:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu   (or a CUDA build from pytorch.org)
# The environments need only the core dependencies; rl is for PPO training and policy rollouts.
rl = ["gymnasium>=1.0,<2", "stable-baselines3>=2.4,<3"]
# Asset regeneration scripts only (convert_glb_to_obj.py also needs genesis-world, which is not listed).
assets = ["trimesh>=4", "coacd>=1.0.11", "pymeshlab>=2025.7"]
test = ["pytest>=8"]

[project.scripts]
ufactory-mujoco = "ufactory_mujoco.cli:main"

[project.urls]
Homepage = "https://github.com/DanielWang123321/ufactory_mujoco"
Repository = "https://github.com/DanielWang123321/ufactory_mujoco"
Issues = "https://github.com/DanielWang123321/ufactory_mujoco/issues"
Changelog = "https://github.com/DanielWang123321/ufactory_mujoco/blob/master/CHANGELOG.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["ufactory_mujoco*"]
namespaces = false

[tool.setuptools.package-data]
ufactory_mujoco = ["data/**/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# configure_backend() must run before mujoco is imported.
"ufactory_mujoco/__init__.py" = ["E402"]
# Long lines are MJCF template text; editing them changes the generated models.
"scripts/build_all_mjcf.py" = ["E501"]
